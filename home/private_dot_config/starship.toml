# Starship — GitHub Dark High Contrast
# Fokus: maximale Lesbarkeit und harmonische Farben

add_newline = false

format = """
$directory$git_branch$git_status
$character"""

[directory]
style = "bold #71b7ff"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold #f0f3f6"
format = "[$branch]($style) "

[git_status]
style = "bold #ffb757"
format = '([$all_status$ahead_behind]($style) )'
modified = "●"
staged = "+"
untracked = "?"
deleted = "✘"
renamed = "»"
conflicted = "="
ahead = "⇡"
behind = "⇣"

[character]
success_symbol = "[❯](bold #4ae168)"
error_symbol = "[❯](bold #ff6a69)"