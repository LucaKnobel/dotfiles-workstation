
# ============================================================
# Kitty Terminal Configuration
# Debian 13 / GNOME / Wayland
# Focus: readability, accessibility, and minimal design
# ============================================================


# ------------------------------------------------------------
# Font
# ------------------------------------------------------------

# Use a programming font with clearly distinguishable glyphs.
# Characters such as 0/O, 1/l/I, and 5/S remain easy to read.
font_family JetBrains Mono

# Comfortable font size for high-resolution displays.
font_size 12

# Disable ligatures to preserve the original appearance of
# operators such as !=, >=, <=, and =>.
disable_ligatures always


# ------------------------------------------------------------
# Cursor
# ------------------------------------------------------------

# Use a thin vertical cursor.
cursor_shape beam

# Disable cursor blinking for a stable visual experience.
cursor_blink_interval 0


# ------------------------------------------------------------
# Readability and Contrast
# ------------------------------------------------------------

# Keep the background fully opaque for maximum contrast.
background_opacity 1.0

# Do not dim text in inactive terminal splits.
inactive_text_alpha 1.0

# Keep selected text readable.
selection_foreground #0a0c10
selection_background #f0f3f6

# Make URLs clearly distinguishable.
url_color #6cb6ff
url_style single


# ------------------------------------------------------------
# Dark High-Contrast Color Scheme
# ------------------------------------------------------------

# Background and foreground.
background #0a0c10
foreground #f0f3f6

# Cursor colors.
cursor #f0f3f6
cursor_text_color #0a0c10

# Standard ANSI colors.
color0  #0a0c10
color1  #ff9492
color2  #7ee787
color3  #ffdf5d
color4  #6cb6ff
color5  #d2a8ff
color6  #76e3ea
color7  #f0f3f6

# Bright ANSI colors.
color8  #8b949e
color9  #ffb1af
color10 #a2f5a2
color11 #ffe98a
color12 #a5d6ff
color13 #e2c5ff
color14 #a4f1f4
color15 #ffffff


# ------------------------------------------------------------
# Window Appearance
# ------------------------------------------------------------

# Add space between terminal content and window borders.
window_padding_width 10

# Use subtle borders between terminal splits.
window_border_width 1pt

# Match the Wayland title bar to the terminal background.
wayland_titlebar_color background

#
hide_window_decorations no

# Avoid distracting visual effects.
background_image none


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

# Position tabs at the top.
tab_bar_edge top

# Use a clean, modern tab design.
tab_bar_style fade

# Hide the tab bar when only one tab exists.
tab_bar_min_tabs 2

# Show the tab index and the active program name.
tab_title_template "{index}: {tab.active_exe}"

# Limit tab titles to avoid excessively wide tabs.
tab_title_max_length 18

# Match the terminal background.
tab_bar_background #0a0c10

# Highlight the active tab.
active_tab_foreground #0a0c10
active_tab_background #f0f3f6
active_tab_font_style bold

# Keep inactive tabs subtle but readable.
inactive_tab_foreground #c9d1d9
inactive_tab_background #21262d
inactive_tab_font_style normal

# ------------------------------------------------------------
# Scrolling and Mouse
# ------------------------------------------------------------

# Store enough terminal history for development workflows.
scrollback_lines 10000

# Hide the mouse cursor while typing.
mouse_hide_wait 3.0


# ------------------------------------------------------------
# Terminal Integration
# ------------------------------------------------------------

# Enable shell integration for supported shells.
shell_integration enabled

# Enable standard terminal bell behavior without sound.
enable_audio_bell no

# Keep all built-in window layouts available.
enabled_layouts *


# ------------------------------------------------------------
# Keyboard Shortcuts
# ------------------------------------------------------------

# Open a new operating system window.
map ctrl+shift+n new_os_window

# Open a new tab.
map ctrl+shift+t new_tab

# Close the current terminal split or window.
map ctrl+shift+w close_window

# Navigate between tabs.
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
titlebar-only
