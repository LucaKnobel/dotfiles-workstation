
# ============================================================
# Hyprlock | Lockscreen
# ============================================================

$font = Inter

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.65
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2

    rounding = 14

    outer_color = rgba(eeeeeecc)
    inner_color = rgba(24272dee)
    font_color = rgb(eeeeee)

    check_color = rgb(88bb99)
    fail_color = rgb(ff6677)

    font_family = $font
    font_size = 16

    placeholder_text = Enter password...
    fail_text = $PAMFAIL

    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $font
    font_size = 64
    color = rgba(ffffffff)

    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 18
    color = rgba(ddddddff)

    position = 0, 25
    halign = center
    valign = center
}
