
# GNOME Desktop Settings
# Arch Linux Workstation

[desktop/interface]
accent-color='slate'
clock-format='24h'
clock-show-date=true
clock-show-seconds=false
clock-show-weekday=false
color-scheme='prefer-dark'
cursor-size=24

[desktop/input-sources]
sources=[('xkb', 'ch')]

[desktop/peripherals/keyboard]
numlock-state=true

[desktop/peripherals/mouse]
speed=1.0

[desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[desktop/calendar]
show-weekdate=false
week-start-day='monday'

[desktop/media-handling]
autorun-never=true

[desktop/session]
idle-delay=uint32 900

[desktop/screensaver]
lock-delay=uint32 3600

[mutter]
dynamic-workspaces=true
workspaces-only-on-primary=true

[desktop/wm/keybindings]
close=['<Super>q']
move-to-workspace-1=['<Shift><Super>1']
move-to-workspace-2=['<Shift><Super>2']
move-to-workspace-3=['<Shift><Super>3']
move-to-workspace-4=['<Shift><Super>4']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
toggle-fullscreen=['<Super>f']

[desktop/wm/preferences]
num-workspaces=4

[shell/app-switcher]
current-workspace-only=false

[shell/keybindings]
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
toggle-quick-settings=@as []

[settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/']
shutdown=['<Shift><Super>e']
www=['<Super>b']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>c'
command='code'
name='VS Code'

[settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>Return'
command='ghostty'
name='Terminal'

[settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>e'
command='nautilus --new-window'
name='Files'

[nautilus/preferences]
date-time-format='detailed'
default-folder-viewer='list-view'

[nautilus/icon-view]
default-zoom-level='small'

[nautilus/list-view]
default-zoom-level='small'
use-tree-view=false

[settings-daemon/plugins/color]
night-light-enabled=true
night-light-schedule-automatic=false
night-light-schedule-to=20.0
night-light-temperature=uint32 3154

[settings-daemon/plugins/power]
power-button-action='interactive'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'
